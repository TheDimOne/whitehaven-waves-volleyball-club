openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lineup
    description: Whitehaven Waves lineup data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /lineup-workbook:
    get:
      operationId: getLineupWorkbook
      tags: [lineup]
      summary: Download the current lineup workbook
      description: Proxies the public lineup workbook for the Whitehaven Waves website.
      responses:
        "200":
          description: Current lineup workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "502":
          description: Workbook source unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

